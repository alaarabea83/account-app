<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>سهل لإدارة الحسابات</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
:root{
  --primary:#0d6efd;
  --primary-hover:#0b5ed7;
  --dark:#212529;
  --sidebar:#1f2937;
  --light:#f8f9fa;
  --border:#dee2e6;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Cairo",sans-serif;
}

body{
  background:var(--light);
  display:flex;
  min-height:100vh;
  color:var(--dark);
}

/* ===== Overlay ===== */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  opacity:0;
  visibility:hidden;
  transition:.3s;
  z-index:998;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

/* ===== Sidebar ===== */
.sidebar{
  width:240px;
  background:var(--sidebar);
  color:white;
  padding:25px 15px;
  display:flex;
  flex-direction:column;
  gap:8px;
  transition:.3s;
}

.sidebar h2{
  text-align:center;
  margin-bottom:20px;
  font-size:20px;
}

.sidebar a{
  text-decoration:none;
  color:#ced4da;
  padding:10px 14px;
  border-radius:8px;
  display:flex;
  align-items:center;
  gap:10px;
  font-size:14px;
  transition:.3s;
}

.sidebar a:hover{
  background:var(--primary);
  color:white;
}

/* ===== Main ===== */
.main{
  flex:1;
  padding:30px;
}

/* ===== Topbar ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.topbar h1{
  font-size:22px;
}

.menu-btn{
  display:none;
  background:var(--primary);
  border:none;
  color:white;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}

.menu-btn:hover{
  background:var(--primary-hover);
}

/* ===== Stats ===== */
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:20px;
  margin-bottom:35px;
}

.stat-box{
  background:white;
  padding:20px;
  border-radius:12px;
  border:1px solid var(--border);
  transition:.3s;
}

.stat-box:hover{
  box-shadow:0 6px 15px rgba(0,0,0,0.08);
  transform:translateY(-4px);
}

.stat-box h4{
  font-size:14px;
  color:#6c757d;
  margin-bottom:6px;
}

.stat-box p{
  font-size:22px;
  font-weight:700;
  color:var(--primary);
}

/* ===== Quick Actions ===== */
.quick{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:18px;
}

.quick a{
  background:white;
  border:1px solid var(--border);
  padding:18px;
  border-radius:12px;
  text-align:center;
  text-decoration:none;
  color:var(--dark);
  transition:.3s;
  font-size:14px;
}

.quick a:hover{
  background:var(--primary);
  color:white;
  transform:translateY(-4px);
}

.quick i{
  display:block;
  font-size:20px;
  margin-bottom:8px;
}

/* ===== Mobile ===== */
@media(max-width:900px){

  body{
    flex-direction:column;
  }

  .menu-btn{
    display:inline-block;
  }

  .sidebar{
    position:fixed;
    top:0;
    right:-260px;
    height:100%;
    z-index:999;
  }

  .sidebar.show{
    right:0;
  }

  .main{
    padding:20px;
  }
}
</style>
</head>

<body>

<div class="overlay" id="overlay"></div>

<!-- ===== Sidebar ===== -->
<div class="sidebar" id="sidebar">
  <h2>سهل</h2>
  <a href="pages/customers.html"><i class="fa fa-users"></i> الحسابات</a>
  <a href="pages/products.html"><i class="fa fa-box"></i> المنتجات</a>
  <a href="pages/sales.html"><i class="fa fa-cart-shopping"></i> المبيعات</a>
  <a href="pages/purchases.html"><i class="fa fa-truck"></i> المشتريات</a>
  <a href="pages/receipts.html"><i class="fa fa-hand-holding-dollar"></i> القبض</a>
  <a href="#"><i class="fa fa-money-bill-wave"></i> الدفع</a>
  <a href="pages/dashboard.html"><i class="fa fa-chart-pie"></i> التقارير</a>
</div>

<!-- ===== Main ===== -->
<div class="main">

  <div class="topbar">
    <button class="menu-btn" onclick="toggleSidebar()">
      <i class="fa fa-bars"></i>
    </button>
    <h1>لوحة التحكم</h1>
  </div>

  <!-- ===== Stats ===== -->
  <div class="stats">
    <div class="stat-box">
      <h4>رصيد الخزينة</h4>
      <p id="cashStat">0 ج</p>
    </div>
    <div class="stat-box">
      <h4>مبيعات اليوم</h4>
      <p id="salesStat">0 ج</p>
    </div>
    <div class="stat-box">
      <h4>أرباح اليوم</h4>
      <p id="profitStat">0 ج</p>
    </div>
    <div class="stat-box">
      <h4>عدد المنتجات</h4>
      <p id="productsStat">0</p>
    </div>
  </div>

  <!-- ===== Quick ===== -->
  <div class="quick">
    <a href="pages/sales.html"><i class="fa fa-plus"></i> فاتورة بيع</a>
    <a href="pages/purchases.html"><i class="fa fa-cart-plus"></i> فاتورة شراء</a>
    <a href="pages/receipts.html"><i class="fa fa-hand-holding-dollar"></i> سند قبض</a>
    <a href="pages/expenses.html"><i class="fa fa-receipt"></i> تسجيل مصروف</a>
    <a href="pages/cash.html"><i class="fa fa-vault"></i> الخزينة</a>
    <a href="pages/profit.html"><i class="fa fa-coins"></i> الأرباح</a>
  </div>

</div>

<script>
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

function toggleSidebar(){
  sidebar.classList.toggle("show");
  overlay.classList.toggle("show");
}

overlay.addEventListener("click", ()=>{
  sidebar.classList.remove("show");
  overlay.classList.remove("show");
});

/* ===== قراءة البيانات من الذاكرة ===== */

function loadDashboardStats(){

  const sales = JSON.parse(localStorage.getItem("sales")) || [];
  const purchases = JSON.parse(localStorage.getItem("purchases")) || [];
  const products = JSON.parse(localStorage.getItem("products")) || [];
  const cashEntries = JSON.parse(localStorage.getItem("cashEntries")) || [];

  const today = new Date().toISOString().split("T")[0];

  const todaySales = sales
    .filter(s => s.date === today)
    .reduce((sum, s) => sum + (Number(s.total) || 0), 0);

  const todayPurchases = purchases
    .filter(p => p.date === today)
    .reduce((sum, p) => sum + (Number(p.total) || 0), 0);

  const todayProfit = todaySales - todayPurchases;

  const cashBalance = cashEntries
    .reduce((sum, e) => sum + (Number(e.amount) || 0), 0);

  document.getElementById("cashStat").innerText = cashBalance.toLocaleString() + " ج";
  document.getElementById("salesStat").innerText = todaySales.toLocaleString() + " ج";
  document.getElementById("profitStat").innerText = todayProfit.toLocaleString() + " ج";
  document.getElementById("productsStat").innerText = products.length;
}

loadDashboardStats();
</script>

</body>
</html>
