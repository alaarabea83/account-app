<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../icons/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&family=Tajawal:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <title>سهل لإدارة الحسابات</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    :root {
    --bg: linear-gradient(135deg,#1e293b,#0f172a);
    --card: #2c3e50;
    --text: #f1f5f9;
    --accent: #CBB884;
    --danger: #ef4444;
}

body {
    margin:0;
    font-family: 'cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #CBB884;
    font-weight: bold;
    z-index: 1002;
    padding: 0 25px;
    height: 65px;
    backdrop-filter: blur(12px);
    box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    border-bottom: 1px solid #334155;
}

.header h1 {
    font-size: 16px;
    margin: 0;
    color: #1f2a44;
}

.breadcrumb {
    background: rgba(28,39,59,0.8);
    padding: 14px 20px;
    text-align: center;
    font-size: 15px;
    border-bottom: 1px solid #334155;
}

.breadcrumb a {
    color: var(--accent);
    text-decoration: none;
    transition: 0.3s;
}

.breadcrumb a:hover {
    color: #f5d78e;
}

.breadcrumb .active {
    color: #cbd5e1;
    font-weight: 500;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    padding: 20px;
}

.stat {
    background: var(--card);
    padding: 20px;
    border-radius: 18px;
    text-align: center;
    transition: 0.3s;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

.stat:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.5);
}

.stat h2 {
    color: var(--accent);
    margin: 10px 0;
    font-size: 22px;
}

.chart-box {
    background: var(--card);
    margin: 20px;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

/* مودال الخسارة */
.loss-modal {
    position: fixed;
    top:0; left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    transition:.3s;
    z-index:9999;
}

.loss-modal.show {
    opacity:1;
    pointer-events:auto;
}

.loss-box {
    background: linear-gradient(145deg, #1e293b, #0f172a);
    padding: 30px;
    border-radius: 20px;
    text-align:center;
    width: 340px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.6);
    border: 1px solid #334155;
    animation: pop .4s ease;
}

@keyframes pop {
    from {transform: scale(.7); opacity:0;}
    to {transform: scale(1); opacity:1;}
}

.loss-icon {
    font-size: 50px;
    margin-bottom: 12px;
    color: var(--danger);
}

.loss-box h2 {
    color: var(--danger);
    margin-bottom:10px;
}

.loss-box p {
    color:#cbd5e1;
    margin-bottom:20px;
}

.loss-box button {
    background: var(--danger);
    border:none;
    padding:12px 22px;
    border-radius:12px;
    color:white;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.loss-box button:hover {
    background:#dc2626;
    box-shadow:0 0 12px var(--danger);
}

/* responsive */
@media (max-width:768px){
    .stats {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }
    .chart-box {
        margin:12px;
        padding:16px;
    }
}

  </style>
</head>

<body>

  <div class="header">
    <h1>نظام الحسابات والفواتير</h1>
  </div>

  <nav class="breadcrumb">
    <a href="../index.html">الرئيسية</a> -
    <span class="active">تقرير الحركة</span>
  </nav>

  <!-- العدادات -->
  <div class="stats">

    <div class="stat">
      <h2 id="cust">0</h2>
      العملاء
    </div>

    <div class="stat">
      <h2 id="inv">0</h2>
      الفواتير
    </div>

    <div class="stat">
      <h2 id="salesT">0</h2>
      المبيعات
    </div>

    <div class="stat">
      <h2 id="profit">0</h2>
      الربح الكلي
    </div>

    <div class="stat">
      <h2 id="profitDay">0</h2>
      ربح اليوم
    </div>

    <div class="stat">
      <h2 id="profitMonth">0</h2>
      ربح الشهر
    </div>

  </div>

  <!-- الرسم البياني -->
  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <!-- مودال الخسارة -->
  <div id="lossModal" class="loss-modal">
    <div class="loss-box">
      <div class="loss-icon">⚠️</div>
      <h2>تنبيه خسارة</h2>
      <p id="lossText">يوجد خسارة في الأرباح</p>

      <button onclick="closeLossModal()">حسناً</button>
    </div>
  </div>

  <script>

    /////////////////////////
    // تحميل البيانات
    /////////////////////////

    const customers = JSON.parse(localStorage.getItem("customers")) || [];
    const sales = JSON.parse(localStorage.getItem("sales")) || [];
    const purchases = JSON.parse(localStorage.getItem("purchases")) || [];
    const products = JSON.parse(localStorage.getItem("products")) || [];
    const expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    /////////////////////////
    // العدادات
    /////////////////////////

    cust.innerText = customers.length;
    inv.innerText = sales.length;

    /////////////////////////
    // إجمالي المبيعات
    /////////////////////////

    let totalSales = 0;

    sales.forEach(inv => {
      if (inv.items) {
        inv.items.forEach(i => {
          totalSales += i.price * i.qty;
        });
      } else {
        totalSales += Number(inv.total || 0);
      }
    });

    salesT.innerText = totalSales.toFixed(2);

    /////////////////////////
    // حساب الربح الحقيقي
    /////////////////////////

    function calcProfit(filterFn) {

      let profit = 0;

      sales.filter(filterFn).forEach(inv => {
        let t = 0, c = 0;

        inv.items?.forEach(item => {
          const pr = products.find(p => p.name == item.name);
          const buy = pr ? Number(pr.buyPrice || 0) : 0;

          t += item.price * item.qty;
          c += buy * item.qty;
        });

        profit += (t - c);
      });

      const exp = expenses
        .filter(filterFn)
        .reduce((s, e) => s + Number(e.amount || 0), 0);

      return profit - exp;
    }

    /////////////////////////
    // فلترة زمنية
    /////////////////////////

    const today = new Date();

    const isToday = d => {
      const x = new Date(d);
      return x.toDateString() == today.toDateString();
    };

    const isMonth = d => {
      const x = new Date(d);
      return x.getMonth() == today.getMonth()
        && x.getFullYear() == today.getFullYear();
    };

    /////////////////////////
    // عرض الأرباح
    /////////////////////////

    profit.innerText = calcProfit(() => true).toFixed(2);
    profitDay.innerText = calcProfit(s => isToday(s.date)).toFixed(2);
    profitMonth.innerText = calcProfit(s => isMonth(s.date)).toFixed(2);

    /////////////////////////
    // تنبيه خسارة
    /////////////////////////

    if (calcProfit(() => true) < 0) {
      showLossModal(calcProfit(() => true));
    }


    /////////////////////////
    // رسم بياني 6 شهور
    /////////////////////////

    const monthNames = [
      "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
      "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
    ];

    let labels = [];
    let data = [];

    for (let i = 5; i >= 0; i--) {
      const d = new Date();
      d.setMonth(d.getMonth() - i);

      const m = d.getMonth();
      const y = d.getFullYear();

      const p = calcProfit(s => {
        const x = new Date(s.date);
        return x.getMonth() == m && x.getFullYear() == y;
      });

      labels.push(monthNames[m]);
      data.push(p.toFixed(2));
    }

    new Chart(chart, {
      type: "bar",
      data: {
        labels: labels,
        datasets: [{
          label: "الأرباح الشهرية",
          data: data
        }]
      }
    });

    /////////////////////////
    // الوضع الليلي
    /////////////////////////

    function toggleMode() {
      document.body.classList.toggle("light");
      localStorage.setItem("mode",
        document.body.classList.contains("light") ? "light" : "dark");
    }

    if (localStorage.getItem("mode") == "light") {
      document.body.classList.add("light");
    }

    /////////////////////////
    // Backup
    /////////////////////////

    function backup() {
      let data = JSON.stringify(localStorage);
      let blob = new Blob([data]);
      let a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "backup.json";
      a.click();
    }

    /////////////////////////
    // Restore
    /////////////////////////

    function restore() {
      let i = document.createElement("input");
      i.type = "file";

      i.onchange = e => {
        let f = e.target.files[0];
        let r = new FileReader();

        r.onload = () => {
          let d = JSON.parse(r.result);
          for (let k in d) {
            localStorage.setItem(k, d[k]);
          }
          location.reload();
        };

        r.readAsText(f);
      };

      i.click();
    }

    function showLossModal(value) {
      document.getElementById("lossText").innerText =
        `يوجد خسارة بقيمة ${value.toFixed(2)} جنيه`;

      document.getElementById("lossModal").classList.add("show");
    }

    function closeLossModal() {
      document.getElementById("lossModal").classList.remove("show");
    }


  </script>

</body>

</html>
