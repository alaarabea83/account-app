<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اتصل بنا</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      body {
        margin: 0;
        font-family: "Cairo", sans-serif;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        color: white;
      }

      /* header */

      header {
        background: #cbb884;
        color: #1e293b;
        text-align: center;
        padding: 18px;
        font-size: 20px;
        font-weight: bold;
      }

      /* container */

      .container {
        max-width: 900px;
        margin: auto;
        padding: 40px 20px;
      }

      /* card */

      .contact-card {
        background: #2c3e50;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
      }

      /* title */

      .contact-title {
        text-align: center;
        margin-bottom: 25px;
        font-size: 24px;
        color: #cbb884;
      }

      /* inputs */

      input,
      textarea {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 10px;
        outline: none;
        box-sizing: border-box;
      }

      /* textarea */

      textarea {
        resize: none;
        height: 120px;
      }

      /* button */

      .send-btn {
        width: 100%;
        padding: 12px;
        background: #cbb884;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .send-btn:hover {
        background: #1f2a44;
        color: white;
      }

      /* contact info */

      .contact-info {
        margin-top: 30px;
        text-align: center;
      }

      .contact-info p {
        margin: 8px 0;
        color: #ccc;
      }

      /* whatsapp button */

      .whatsapp-btn {
        display: inline-block;
        margin-top: 20px;
        background: #25d366;
        color: white;
        padding: 12px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
      }

      .whatsapp-btn:hover {
        background: #1da851;
      }

      .whatsapp-btn i {
        margin-left: 8px;
      }

      /* footer */

      footer {
        margin-top: 40px;
        text-align: center;
        padding: 15px;
        background: #0f172a;
        color: #aaa;
        border-top: 1px solid #cbb884;
      }

      .whatsapp-float {
        position: fixed;
        bottom: 25px;
        right: 25px;
        background: #25d366;
        color: white;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        transition:
          transform 0.3s,
          box-shadow 0.3s;
        z-index: 1000;
      }

      .whatsapp-float:hover {
        transform: scale(1.1);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      }

      input:focus,
      textarea:focus {
        border: 2px solid #cbb884;
        box-shadow: 0 0 10px #cbb884;
        background: #1e293b;
        transition: 0.3s;
      }
    </style>
  </head>

  <body>
    <header>
      <i class="fa-solid fa-headset"></i>
      اتصل بنا
    </header>

    <div class="container">
      <div class="contact-card">
        <div class="contact-title">نحن هنا لمساعدتك</div>

        <form>
          <input type="text" placeholder="الاسم" />

          <input type="email" placeholder="البريد الإلكتروني" />

          <textarea placeholder="اكتب رسالتك هنا"></textarea>

          <button class="send-btn">إرسال الرسالة</button>
        </form>

        <div class="contact-info">
          <p><i class="fa-solid fa-envelope"></i> alaarabea83@gmail.com</p>

          <p><i class="fa-solid fa-phone"></i> 01019065615</p>
        </div>
      </div>
    </div>

    <footer>© 2026 جميع الحقوق محفوظة</footer>

    <a href="https://wa.me/201019065615" target="_blank" class="whatsapp-float">
      <i class="fa-brands fa-whatsapp"></i>
    </a>
  </body>
</html>
