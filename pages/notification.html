<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الإشعارات</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f8f6ef;
        }

        /* ===== Header ===== */
        .header {
            background: #dccb9a;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .back-btn {
            text-decoration: none;
            color: #333;
            font-size: 18px;
        }

        /* ===== Container ===== */
        .container {
            max-width: 750px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* ===== Notification Card ===== */
        .notification-card {
            background: white;
            padding: 18px 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            transition: 0.3s;
        }

        .notification-card:hover {
            transform: translateY(-3px);
        }

        .icon-box {
            width: 45px;
            height: 45px;
            background: #f5ebd3;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #8b7a50;
        }

        .notification-text {
            flex: 1;
        }

        .notification-text p {
            margin: 0;
            font-size: 14px;
            color: #333;
        }

        .notification-text span {
            font-size: 12px;
            color: #888;
        }

        /* ===== Empty State ===== */
        .empty {
            text-align: center;
            color: #888;
            margin-top: 50px;
        }
    </style>
</head>

<body>
    <div class="header">
        <a href="../index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i>
        </a>
        <h1>الإشعارات</h1>
    </div>

    <div class="container" id="notificationsContainer"></div>

    <script>
        // ✨ عدل هنا براحتك
        let notifications = [
            {
                text: "سيتم إيقاف النظام للصيانة يوم الجمعة الساعة 10 مساءً",
                date: "اليوم",
                icon: "fa-wrench",
            },
            {
                text: "تم تحديث شروط الاستخدام",
                date: "أمس",
                icon: "fa-file-alt",
            },
            {
                text: "يرجى مراجعة الفواتير قبل اعتمادها",
                date: "منذ يومين",
                icon: "fa-circle-exclamation",
            },
        ];

        // حفظ العدد في localStorage عشان يظهر في الجرس
        localStorage.setItem("notificationCount", notifications.length);

        // عرض الإشعارات
        function renderNotifications() {
            const container = document.getElementById("notificationsContainer");
            container.innerHTML = "";

            if (notifications.length === 0) {
                container.innerHTML = `<div class="empty">لا توجد إشعارات حالياً</div>`;
                return;
            }

            notifications.forEach((note) => {
                container.innerHTML += `
    <div class="notification-card">
        <div class="icon-box">
        <i class="fas ${note.icon}"></i>
        </div>
        <div class="notification-text">
        <p>${note.text}</p>
        <span>${note.date}</span>
        </div>
    </div>
    `;
            });
        }

        renderNotifications();
    </script>
</body>

</html>
